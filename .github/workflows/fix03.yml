name: fix03
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '\n/* readable link on section 03 */\n.places .bravio-link{color:var(--brand);border-bottom-color:rgba(110,50,24,.38);font-weight:500}\n.places .bravio-link:hover{color:var(--ink);border-bottom-color:var(--ink)}\n' >> style.css
          rm .github/workflows/fix03.yml
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add style.css .github/workflows/fix03.yml
          git commit -m "Improve section 03 link contrast"
          git push
