name: Fix rate wording

on:
  push:
    paths:
      - '.github/workflows/fix-rate-wording.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine nightly-rate wording and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('numbering-fix.js')
          s = p.read_text()
          old = "`${c.rateLine}: ${euro(NIGHTLY_RATE)} / ${c.perNight}`,"
          new = "`${c.rateLine}: ${euro(NIGHTLY_RATE)} ${c.perNight}`,"
          if old not in s:
              raise SystemExit('Expected rate wording not found')
          p.write_text(s.replace(old, new, 1))
          h = Path('index.html')
          html = h.read_text()
          if 'numbering-fix.js?v=2' not in html:
              raise SystemExit('Expected cache version not found')
          h.write_text(html.replace('numbering-fix.js?v=2', 'numbering-fix.js?v=3', 1))
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numbering-fix.js index.html
          git commit -m "Refine nightly rate wording" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-rate-wording.yml
          git commit -m "Remove temporary rate workflow"
          git push
