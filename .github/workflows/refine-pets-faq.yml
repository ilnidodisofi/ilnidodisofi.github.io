name: Refine pet FAQ wording
on:
  push:
    paths:
      - '.github/workflows/refine-pets-faq.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update pet FAQ wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Update the visible Italian fallback in the homepage.
          p = Path('index.html')
          s = p.read_text()
          old = 'Sì, gli animali sono ammessi. Ti chiediamo semplicemente di segnalarlo nella richiesta.'
          new = 'Sì, gli animali sono benvenuti. Ti chiediamo di segnalarne la presenza nella richiesta, così possiamo organizzare al meglio il soggiorno.'
          if old not in s:
              raise SystemExit('Italian pet FAQ fallback not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Keep the translated FAQ answers aligned with the same, discreet wording.
          js = Path('script.js')
          t = js.read_text()
          replacements = {
            'it': 'Sì, gli animali sono benvenuti. Ti chiediamo di segnalarne la presenza nella richiesta, così possiamo organizzare al meglio il soggiorno.',
            'en': 'Yes, pets are welcome. Please let us know in your request if you are travelling with a pet, so we can prepare the stay accordingly.',
            'es': 'Sí, las mascotas son bienvenidas. Te pedimos que indiques su presencia en la solicitud para que podamos organizar la estancia de la mejor manera.',
            'de': 'Ja, Haustiere sind willkommen. Bitte gib bei deiner Anfrage an, wenn du mit einem Haustier reist, damit wir den Aufenthalt entsprechend vorbereiten können.',
            'fr': 'Oui, les animaux sont les bienvenus. Merci de nous signaler leur présence dans votre demande afin que nous puissions organiser au mieux le séjour.',
            'ru': 'Да, домашние животные приветствуются. Пожалуйста, укажите их в запросе, чтобы мы могли лучше подготовить ваше пребывание.',
            'zh': '可以携带宠物。请在发送住宿请求时告知我们，以便我们提前做好相应安排。'
          }
          for lang, text in replacements.items():
              pat = rf'(\b{lang}:\s*\{{.*?"faq\.pets\.a":)"[^"]*"'
              t2, n = re.subn(pat, lambda m: m.group(1) + '"' + text.replace('"','\\"') + '"', t, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not update pet FAQ for {lang}: {n}')
              t = t2
          js.write_text(t)
          PY
      - name: Verify changes
        run: |
          grep -Fq 'Ti chiediamo di segnalarne la presenza nella richiesta' index.html
          grep -Fq 'Please let us know in your request if you are travelling with a pet' script.js
          ! grep -Fq 'Ti chiediamo semplicemente di segnalarlo nella richiesta' index.html
      - name: Commit changes
        run: |
          git config user.name 'Il Nido di Sofì'
          git config user.email 'ilnidodisofi@gmail.com'
          git add index.html script.js
          git commit -m 'Refine pet FAQ wording'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/refine-pets-faq.yml
          git commit -m 'Remove temporary pet FAQ workflow'
          git push
