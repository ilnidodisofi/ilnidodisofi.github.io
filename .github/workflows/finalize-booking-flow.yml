name: Finalize booking flow copy and link contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-booking-flow.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking copy, cache busting and link contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('Invia una richiesta con le date desiderate. Verificheremo personalmente la disponibilità e ti risponderemo via email prima del pagamento.', 'Invia una richiesta con le date desiderate. Verificheremo personalmente la disponibilità e il totale del soggiorno; dopo la conferma riceverai un link Stripe sicuro con l’importo esatto concordato.')
          s = s.replace('La richiesta non costituisce ancora una prenotazione: riceverai la conferma della disponibilità via email. Il pagamento online verrà richiesto solo successivamente.', 'La richiesta non comporta alcun pagamento. La prenotazione sarà confermata solo dopo la nostra verifica e il pagamento tramite il link Stripe personale che riceverai via email o WhatsApp.')
          s = re.sub(r'style\.css\?v=\d+', 'style.css?v=12', s)
          s = re.sub(r'script\.js\?v=\d+', 'script.js?v=12', s)
          index.write_text(s)

          texts = {
            'it': (
              'Invia una richiesta con le date desiderate. Verificheremo personalmente la disponibilità e il totale del soggiorno; dopo la conferma riceverai un link Stripe sicuro con l’importo esatto concordato.',
              'La richiesta non comporta alcun pagamento. La prenotazione sarà confermata solo dopo la nostra verifica e il pagamento tramite il link Stripe personale che riceverai via email o WhatsApp.'
            ),
            'en': (
              'Send us your preferred dates. We will personally confirm availability and the total stay price; once confirmed, you will receive a secure Stripe payment link for the exact agreed amount.',
              'Submitting a request does not require payment. Your booking is confirmed only after our availability check and payment through the personal Stripe link sent to you by email or WhatsApp.'
            ),
            'es': (
              'Envíanos las fechas deseadas. Comprobaremos personalmente la disponibilidad y el total de la estancia; después recibirás un enlace seguro de Stripe con el importe exacto acordado.',
              'Enviar la solicitud no implica ningún pago. La reserva se confirma solo después de nuestra comprobación y del pago mediante el enlace personal de Stripe que recibirás por email o WhatsApp.'
            ),
            'de': (
              'Sende uns deine gewünschten Reisedaten. Wir prüfen persönlich Verfügbarkeit und Gesamtpreis; anschließend erhältst du einen sicheren Stripe-Zahlungslink über den genau vereinbarten Betrag.',
              'Mit der Anfrage ist noch keine Zahlung verbunden. Die Buchung wird erst nach unserer Verfügbarkeitsprüfung und der Zahlung über deinen persönlichen Stripe-Link per E-Mail oder WhatsApp bestätigt.'
            ),
            'fr': (
              'Envoyez-nous les dates souhaitées. Nous vérifierons personnellement la disponibilité et le montant total du séjour; après confirmation, vous recevrez un lien Stripe sécurisé correspondant exactement au montant convenu.',
              'L’envoi de la demande n’entraîne aucun paiement. La réservation n’est confirmée qu’après notre vérification et le paiement via le lien Stripe personnel envoyé par e-mail ou WhatsApp.'
            ),
            'ru': (
              'Отправьте желаемые даты. Мы лично проверим доступность и итоговую стоимость проживания; после подтверждения вы получите безопасную ссылку Stripe на точно согласованную сумму.',
              'Отправка запроса не требует оплаты. Бронирование подтверждается только после нашей проверки и оплаты по персональной ссылке Stripe, отправленной по email или WhatsApp.'
            ),
            'zh': (
              '请发送您希望入住的日期。我们会亲自确认房源可用情况和住宿总价；确认后，您将收到一个安全的 Stripe 付款链接，金额与双方确认的总价完全一致。',
              '提交申请时无需付款。只有在我们确认可用情况并通过发送给您的专属 Stripe 链接完成付款后，预订才算正式确认。'
            ),
          }

          p = Path('script.js')
          js = p.read_text()
          langs = list(texts)
          for i, lang in enumerate(langs):
              start_pat = rf'(^|\n)\s*{lang}:\s*\{{'
              m = re.search(start_pat, js)
              if not m:
                  raise SystemExit(f'Language block not found: {lang}')
              start = m.start()
              if i + 1 < len(langs):
                  m2 = re.search(rf'(^|\n)\s*{langs[i+1]}:\s*\{{', js[m.end():])
                  end = m.end() + m2.start() if m2 else len(js)
              else:
                  end = len(js)
              block = js[start:end]
              intro, note = texts[lang]
              block, n1 = re.subn(r'("booking\.intro"\s*:\s*)"(?:\\.|[^"\\])*"', lambda m: m.group(1) + '"' + intro.replace('\\','\\\\').replace('"','\\"') + '"', block, count=1)
              block, n2 = re.subn(r'("booking\.note"\s*:\s*)"(?:\\.|[^"\\])*"', lambda m: m.group(1) + '"' + note.replace('\\','\\\\').replace('"','\\"') + '"', block, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'Booking keys not replaced for {lang}: {n1}, {n2}')
              js = js[:start] + block + js[end:]
          p.write_text(js)

          cssp = Path('style.css')
          css = cssp.read_text()
          addition = '''\n\n/* v12 — readable internal SEO links on light sections */\n.places .bravio-link,\n.valdorcia .bravio-link{\n  color:var(--brand);\n  border-bottom-color:rgba(110,50,24,.38);\n  font-weight:500;\n}\n.places .bravio-link:hover,\n.valdorcia .bravio-link:hover{\n  color:var(--ink);\n  border-bottom-color:var(--ink);\n}\n'''
          if 'v12 — readable internal SEO links on light sections' not in css:
              cssp.write_text(css + addition)
          PY
      - name: Commit changes
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add index.html script.js style.css
          git commit -m "Clarify secure Stripe booking flow and link contrast" || true
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          rm .github/workflows/finalize-booking-flow.yml
          git add .github/workflows/finalize-booking-flow.yml
          git commit -m "Remove temporary booking flow workflow"
          git push
