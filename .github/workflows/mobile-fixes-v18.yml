name: Mobile fixes v18
on:
  push:
    paths:
      - '.github/workflows/mobile-fixes-v18.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Remove the thin coloured/green strip above the lounge gallery on phones only.
          css=Path('style.css')
          s=css.read_text()
          patch='''\n\n/* v18 — mobile polish */\n@media(max-width:560px){\n  .gallery-v2{border-top:0!important;outline:0!important;box-shadow:none!important;}\n  .gallery-v2::before{display:none!important;}\n}\n'''
          if '/* v18 — mobile polish */' not in s:
              s += patch
          css.write_text(s)

          # Enforce a true two-night minimum even on mobile browsers whose native
          # date picker may visually allow tapping the following day.
          js=Path('script.js')
          j=js.read_text()
          anchor="  co.addEventListener('change',updateSummary);"
          replacement="""  co.addEventListener('change',()=>{\n    if(ci.value && co.value){\n      const minCheckout=new Date(`${ci.value}T12:00:00`);\n      minCheckout.setDate(minCheckout.getDate()+2);\n      const minValue=iso(minCheckout);\n      co.min=minValue;\n      if(co.value<minValue){\n        co.value='';\n        updateSummary();\n        return;\n      }\n    }\n    updateSummary();\n  });"""
          if replacement not in j:
              j=j.replace(anchor,replacement,1)
          js.write_text(j)

          # Cache-bust assets.
          html=Path('index.html')
          h=html.read_text()
          import re
          h=re.sub(r'style\.css\?v=\d+','style.css?v=18',h)
          h=re.sub(r'script\.js\?v=\d+','script.js?v=18',h)
          html.write_text(h)
          PY
      - name: Verify
        run: |
          grep -q 'v18 — mobile polish' style.css
          grep -q 'if(co.value<minValue)' script.js
          grep -q 'style.css?v=18' index.html
          grep -q 'script.js?v=18' index.html
      - name: Commit
        run: |
          git config user.name 'Il Nido di Sofì'
          git config user.email 'ilnidodisofi@gmail.com'
          git add index.html style.css script.js
          git commit -m 'Polish mobile gallery and enforce two-night minimum' || exit 0
          git push
