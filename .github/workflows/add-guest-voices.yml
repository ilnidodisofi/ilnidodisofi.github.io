name: Add guest voices section
on:
  push:
    paths:
      - '.github/workflows/add-guest-voices.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add guest voices section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ip=Path('index.html')
          s=ip.read_text()
          if 'id="guest-voices"' in s:
              raise SystemExit('guest voices section already exists')

          section='''\n    <section class="guest-voices section" id="guest-voices">\n      <div class="section-kicker" data-guest-voice="kicker">COSA APPREZZANO I NOSTRI OSPITI</div>\n      <div class="guest-voices-head">\n        <h2 data-guest-voice="title">Piccole cose che\n          <em>fanno la differenza.</em></h2>\n      </div>\n      <div class="guest-voices-grid">\n        <article class="guest-voice-card">\n          <h3 data-guest-voice="h1">Sentirsi subito a casa</h3>\n          <p data-guest-voice="p1">Un ambiente raccolto e accogliente, dove è facile rallentare e ritrovare quella sensazione di tranquillità che fa sentire subito a proprio agio.</p>\n          <p class="guest-voice-name">— Fiona</p>\n        </article>\n        <article class="guest-voice-card">\n          <h3 data-guest-voice="h2">Il silenzio, nel cuore del borgo</h3>\n          <p data-guest-voice="p2">Essere nel centro storico di Montepulciano e, una volta chiusa la porta, trovare calma e silenzio: una combinazione particolarmente piacevole per riposare davvero.</p>\n          <p class="guest-voice-name">— Penelope</p>\n        </article>\n        <article class="guest-voice-card">\n          <h3 data-guest-voice="h3">Il carattere della casa</h3>\n          <p data-guest-voice="p3">Il cotto, le travi a vista, gli arredi e i piccoli dettagli restituiscono il carattere di una casa toscana autentica, curata senza perdere la sua semplicità.</p>\n          <p class="guest-voice-name">— Beatrice</p>\n        </article>\n      </div>\n    </section>\n'''
          m=re.search(r'(^\s*<section[^>]*id=["\']faq["\'][^>]*>)', s, re.M)
          if not m:
              raise SystemExit('FAQ section marker not found')
          s=s[:m.start()]+section+'\n'+s[m.start():]

          localizer='''\n  <script>\n  document.addEventListener('DOMContentLoaded',()=>{\n    const copy={\n      it:{kicker:'COSA APPREZZANO I NOSTRI OSPITI',title:'Piccole cose che <em>fanno la differenza.</em>',h1:'Sentirsi subito a casa',p1:'Un ambiente raccolto e accogliente, dove è facile rallentare e ritrovare quella sensazione di tranquillità che fa sentire subito a proprio agio.',h2:'Il silenzio, nel cuore del borgo',p2:'Essere nel centro storico di Montepulciano e, una volta chiusa la porta, trovare calma e silenzio: una combinazione particolarmente piacevole per riposare davvero.',h3:'Il carattere della casa',p3:'Il cotto, le travi a vista, gli arredi e i piccoli dettagli restituiscono il carattere di una casa toscana autentica, curata senza perdere la sua semplicità.'},\n      en:{kicker:'WHAT OUR GUESTS APPRECIATE',title:'Small details that <em>make a difference.</em>',h1:'Feeling at home right away',p1:'A warm, intimate setting where it is easy to slow down and enjoy the sense of calm that makes you feel immediately at ease.',h2:'Quiet, in the heart of the old town',p2:'Being in Montepulciano’s historic centre and, once the door closes, finding calm and quiet makes it especially pleasant to truly rest.',h3:'The character of the house',p3:'Terracotta floors, exposed beams, furnishings and small details convey the character of an authentic Tuscan home, cared for without losing its simplicity.'},\n      es:{kicker:'LO QUE APRECIAN NUESTROS HUÉSPEDES',title:'Pequeños detalles que <em>marcan la diferencia.</em>',h1:'Sentirse en casa desde el primer momento',p1:'Un ambiente acogedor e íntimo donde resulta fácil bajar el ritmo y disfrutar de una tranquilidad que hace sentirse enseguida a gusto.',h2:'Silencio, en pleno centro histórico',p2:'Estar en el centro histórico de Montepulciano y, al cerrar la puerta, encontrar calma y silencio: una combinación especialmente agradable para descansar de verdad.',h3:'El carácter de la casa',p3:'El barro cocido, las vigas vistas, el mobiliario y los pequeños detalles transmiten el carácter de una auténtica casa toscana, cuidada sin perder su sencillez.'},\n      de:{kicker:'WAS UNSERE GÄSTE SCHÄTZEN',title:'Kleine Dinge, die <em>den Unterschied machen.</em>',h1:'Sich sofort wie zu Hause fühlen',p1:'Eine ruhige, einladende Atmosphäre, in der man leicht entschleunigt und sich sofort wohlfühlt.',h2:'Ruhe mitten in der Altstadt',p2:'Mitten im historischen Zentrum von Montepulciano zu sein und hinter der geschlossenen Tür Ruhe und Stille zu finden, macht erholsamen Schlaf besonders angenehm.',h3:'Der Charakter des Hauses',p3:'Terrakottaböden, sichtbare Balken, Möbel und kleine Details verleihen dem Haus den authentischen Charakter eines gepflegten toskanischen Zuhauses.'},\n      fr:{kicker:'CE QUE NOS HÔTES APPRÉCIENT',title:'De petits détails qui <em>font la différence.</em>',h1:'Se sentir chez soi tout de suite',p1:'Une atmosphère intime et accueillante où il est facile de ralentir et de retrouver ce sentiment de calme qui met immédiatement à l’aise.',h2:'Le silence, au cœur du centre historique',p2:'Être dans le centre historique de Montepulciano et, une fois la porte fermée, retrouver calme et silence : une combinaison particulièrement agréable pour vraiment se reposer.',h3:'Le caractère de la maison',p3:'La terre cuite, les poutres apparentes, le mobilier et les petits détails restituent le caractère d’une authentique maison toscane, soignée sans perdre sa simplicité.'},\n      ru:{kicker:'ЧТО ЦЕНЯТ НАШИ ГОСТИ',title:'Мелочи, которые <em>имеют значение.</em>',h1:'Сразу почувствовать себя как дома',p1:'Уютная и камерная атмосфера, где легко замедлиться и почувствовать спокойствие и комфорт.',h2:'Тишина в самом сердце исторического центра',p2:'Жить в историческом центре Монтепульчано и, закрыв дверь, находить тишину и покой — особенно приятно для полноценного отдыха.',h3:'Характер дома',p3:'Терракотовые полы, открытые балки, мебель и детали создают атмосферу настоящего тосканского дома, ухоженного и при этом простого.'},\n      zh:{kicker:'住客喜欢这里的地方',title:'那些<em>真正带来不同的小细节。</em>',h1:'一进门就有家的感觉',p1:'温馨而安静的空间，让人自然放慢节奏，很快感到放松自在。',h2:'身处老城中心，却依然安静',p2:'住在蒙特普尔恰诺历史中心，关上门后却能享受宁静，这种反差尤其适合真正放松休息。',h3:'房子的托斯卡纳气质',p3:'赤陶地面、外露木梁、家具和细节，共同保留了真实的托斯卡纳住宅气息，精心而不失朴素。'}\n    };\n    const apply=()=>{\n      const sel=document.getElementById('languageSelect');\n      const lang=(sel&&sel.value)||localStorage.getItem('nidoLanguage')||'it';\n      const t=copy[lang]||copy.it;\n      document.querySelectorAll('[data-guest-voice]').forEach(el=>{\n        const k=el.dataset.guestVoice;\n        if(k==='title') el.innerHTML=t[k]; else if(t[k]) el.textContent=t[k];\n      });\n    };\n    apply();\n    document.getElementById('languageSelect')?.addEventListener('change',()=>setTimeout(apply,0));\n  });\n  </script>\n'''
          if '</body>' not in s:
              raise SystemExit('body close not found')
          s=s.replace('</body>',localizer+'\n</body>',1)
          s=s.replace('style.css?v=15','style.css?v=16')
          ip.write_text(s)

          sp=Path('style.css')
          css=sp.read_text()
          marker='/* v16 — guest voices */'
          if marker in css:
              raise SystemExit('guest voices css already exists')
          css += '''\n\n/* v16 — guest voices */\n.guest-voices{padding-top:105px;padding-bottom:105px}\n.guest-voices-head{margin-top:24px;max-width:760px}\n.guest-voices-head h2{max-width:760px}\n.guest-voices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:58px}\n.guest-voice-card{padding:34px 34px 30px 0;border-right:1px solid var(--line);margin-right:34px;display:flex;flex-direction:column;min-height:290px}\n.guest-voice-card:last-child{border-right:0;margin-right:0}\n.guest-voice-card h3{font:500 31px/1.05 var(--serif);margin:0 0 18px}\n.guest-voice-card p{font-size:14px;color:#55584f;margin:0;line-height:1.75}\n.guest-voice-card .guest-voice-name{margin-top:auto;padding-top:26px;font:italic 400 17px/1.2 var(--serif);color:rgba(37,40,33,.55)}\n@media(max-width:900px){.guest-voices-grid{grid-template-columns:1fr}.guest-voice-card{min-height:0;border-right:0;border-bottom:1px solid var(--line);margin-right:0;padding:30px 0}.guest-voice-card:last-child{border-bottom:0}.guest-voices{padding-top:80px;padding-bottom:80px}}\n'''
          sp.write_text(css)
          PY
      - name: Sanity checks
        run: |
          grep -q 'id="guest-voices"' index.html
          grep -q 'Fiona' index.html
          grep -q 'Penelope' index.html
          grep -q 'Beatrice' index.html
          grep -q 'style.css?v=16' index.html
          grep -q 'v16 — guest voices' style.css
      - name: Commit changes
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add index.html style.css
          git commit -m "Add guest appreciation section"
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/add-guest-voices.yml
          git commit -m "Remove temporary guest voices workflow"
          git push
