name: Premium value update
on:
  push:
    paths:
      - '.github/workflows/premium-value-section.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 scripts/premium_update.py
      - name: Verify update
        run: |
          grep -q 'id="pensato-per-due"' index.html
          grep -q 'Soggiorno minimo: 2 notti' index.html
          grep -q 'style.css?v=17' index.html
          grep -q 'script.js?v=17' index.html
          grep -q 'd.getDate()+2' script.js
      - name: Commit update
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add index.html style.css script.js
          git commit -m "Refine homepage value positioning and two-night minimum"
          git push
      - name: Clean temporary files
        if: always()
        run: |
          git pull --rebase || true
          rm -f .github/workflows/premium-value-section.yml scripts/premium_update.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary premium update files"
            git push
          fi