name: Polish booking flow
on:
  push:
    paths:
      - '.github/workflows/polish-booking-flow.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking experience
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # INDEX
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('style.css?v=12','style.css?v=13').replace('script.js?v=12','script.js?v=13')

          old='''        <p class="booking-intro" data-i18n="booking.intro">Invia una richiesta con le date desiderate. Verificheremo personalmente la disponibilità e il totale del soggiorno; dopo la conferma riceverai un link Stripe sicuro con l’importo esatto concordato.</p>\n\n        <form id="bookingForm" action="https://formsubmit.co/ilnidodisofi@gmail.com" method="POST">'''
          new='''        <p class="booking-intro" data-i18n="booking.intro">Invia una richiesta con le date desiderate. Verificheremo personalmente la disponibilità e il totale del soggiorno; dopo la conferma riceverai un link Stripe sicuro con l’importo esatto concordato.</p>\n\n        <div class="booking-flow" aria-label="Come funziona la prenotazione diretta">\n          <div class="booking-step"><span>01</span><strong data-i18n="booking.step1.title">Invia la richiesta</strong><p data-i18n="booking.step1.text">Indicaci date, ospiti e un recapito WhatsApp.</p></div>\n          <div class="booking-step"><span>02</span><strong data-i18n="booking.step2.title">Verifichiamo noi</strong><p data-i18n="booking.step2.text">Controlliamo disponibilità e totale del soggiorno.</p></div>\n          <div class="booking-step"><span>03</span><strong data-i18n="booking.step3.title">Conferma con Stripe</strong><p data-i18n="booking.step3.text">Ricevi un link personale e paghi solo dopo la nostra conferma.</p></div>\n        </div>\n\n        <form id="bookingForm" action="https://formsubmit.co/ilnidodisofi@gmail.com" method="POST">'''
          if old not in s: raise SystemExit('index intro anchor not found')
          s=s.replace(old,new,1)

          old2='''          <input type="hidden" name="_url" value="https://ilnidodisofi.github.io/#prenota">\n          <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off">'''
          new2='''          <input type="hidden" name="_url" value="https://ilnidodisofi.github.io/#prenota">\n          <input type="hidden" name="Notti" id="nights" value="">\n          <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off">'''
          if old2 not in s: raise SystemExit('hidden inputs anchor not found')
          s=s.replace(old2,new2,1)

          old3='''            <label><span data-i18n="form.name">Nome e cognome</span><input type="text" name="Nome e cognome" required autocomplete="name"></label>\n            <label><span data-i18n="form.email">Email</span><input type="email" name="email" required autocomplete="email"></label>\n            <label><span data-i18n="form.checkin">Check-in</span><input id="checkin" type="date" name="Check-in" required></label>\n            <label><span data-i18n="form.checkout">Check-out</span><input id="checkout" type="date" name="Check-out" required></label>\n            <label><span data-i18n="form.guests">Ospiti</span><select name="Ospiti"><option value="1">1</option><option value="2" selected>2</option></select></label>\n            <label><span data-i18n="form.message">Messaggio</span><input type="text" name="Messaggio" data-i18n-placeholder="form.messagePlaceholder" placeholder="Eventuali richieste"></label>'''
          new3='''            <label><span data-i18n="form.name">Nome e cognome</span><input type="text" name="Nome e cognome" required autocomplete="name"></label>\n            <label><span data-i18n="form.email">Email</span><input type="email" name="email" required autocomplete="email"></label>\n            <label><span data-i18n="form.phone">Telefono / WhatsApp</span><input type="tel" name="Telefono / WhatsApp" required autocomplete="tel" inputmode="tel" placeholder="+39 ..."></label>\n            <label><span data-i18n="form.guests">Ospiti</span><select name="Ospiti"><option value="1">1</option><option value="2" selected>2</option></select></label>\n            <label><span data-i18n="form.checkin">Check-in</span><input id="checkin" type="date" name="Check-in" required></label>\n            <label><span data-i18n="form.checkout">Check-out</span><input id="checkout" type="date" name="Check-out" required></label>\n            <label class="form-message"><span data-i18n="form.message">Messaggio</span><input type="text" name="Messaggio" data-i18n-placeholder="form.messagePlaceholder" placeholder="Eventuali richieste"></label>'''
          if old3 not in s: raise SystemExit('form fields anchor not found')
          s=s.replace(old3,new3,1)

          old4='''          </div>\n          <button class="button button-dark" type="submit" data-i18n="form.submit">Invia richiesta</button>'''
          new4='''          </div>\n          <div class="booking-summary" id="bookingSummary" hidden aria-live="polite"></div>\n          <button class="button button-dark" type="submit" data-i18n="form.submit">Invia richiesta</button>'''
          if old4 not in s: raise SystemExit('submit anchor not found')
          s=s.replace(old4,new4,1)
          p.write_text(s)

          # SCRIPT
          p=Path('script.js')
          s=p.read_text()
          anchor='''const languageMeta = {'''
          block='''const bookingV13Translations = {\n  it:{\n    "booking.step1.title":"Invia la richiesta","booking.step1.text":"Indicaci date, ospiti e un recapito WhatsApp.",\n    "booking.step2.title":"Verifichiamo noi","booking.step2.text":"Controlliamo disponibilità e totale del soggiorno.",\n    "booking.step3.title":"Conferma con Stripe","booking.step3.text":"Ricevi un link personale e paghi solo dopo la nostra conferma.",\n    "form.phone":"Telefono / WhatsApp"\n  },\n  en:{\n    "booking.step1.title":"Send your request","booking.step1.text":"Tell us your dates, guests and a WhatsApp contact.",\n    "booking.step2.title":"We check it personally","booking.step2.text":"We verify availability and the total stay price.",\n    "booking.step3.title":"Confirm with Stripe","booking.step3.text":"You receive a personal link and pay only after our confirmation.",\n    "form.phone":"Phone / WhatsApp"\n  },\n  es:{\n    "booking.step1.title":"Envía tu solicitud","booking.step1.text":"Indícanos fechas, huéspedes y un contacto de WhatsApp.",\n    "booking.step2.title":"Lo comprobamos nosotros","booking.step2.text":"Verificamos disponibilidad y el total de la estancia.",\n    "booking.step3.title":"Confirma con Stripe","booking.step3.text":"Recibes un enlace personal y pagas solo tras nuestra confirmación.",\n    "form.phone":"Teléfono / WhatsApp"\n  },\n  de:{\n    "booking.step1.title":"Anfrage senden","booking.step1.text":"Nennen Sie uns Daten, Gästezahl und einen WhatsApp-Kontakt.",\n    "booking.step2.title":"Wir prüfen persönlich","booking.step2.text":"Wir prüfen Verfügbarkeit und den Gesamtpreis des Aufenthalts.",\n    "booking.step3.title":"Mit Stripe bestätigen","booking.step3.text":"Sie erhalten einen persönlichen Link und zahlen erst nach unserer Bestätigung.",\n    "form.phone":"Telefon / WhatsApp"\n  },\n  fr:{\n    "booking.step1.title":"Envoyez votre demande","booking.step1.text":"Indiquez vos dates, le nombre de voyageurs et un contact WhatsApp.",\n    "booking.step2.title":"Nous vérifions nous-mêmes","booking.step2.text":"Nous confirmons les disponibilités et le montant total du séjour.",\n    "booking.step3.title":"Confirmez avec Stripe","booking.step3.text":"Vous recevez un lien personnel et ne payez qu’après notre confirmation.",\n    "form.phone":"Téléphone / WhatsApp"\n  },\n  ru:{\n    "booking.step1.title":"Отправьте запрос","booking.step1.text":"Укажите даты, число гостей и контакт WhatsApp.",\n    "booking.step2.title":"Мы всё проверим","booking.step2.text":"Мы лично проверим доступность и общую стоимость проживания.",\n    "booking.step3.title":"Подтвердите через Stripe","booking.step3.text":"Вы получите персональную ссылку и оплатите только после нашего подтверждения.",\n    "form.phone":"Телефон / WhatsApp"\n  },\n  zh:{\n    "booking.step1.title":"提交住宿申请","booking.step1.text":"告诉我们日期、入住人数和 WhatsApp 联系方式。",\n    "booking.step2.title":"我们人工确认","booking.step2.text":"我们会核实房态和住宿总价。",\n    "booking.step3.title":"通过 Stripe 确认","booking.step3.text":"确认后你会收到专属支付链接，再进行付款。",\n    "form.phone":"电话 / WhatsApp"\n  }\n};\n\n'''
          if anchor not in s: raise SystemExit('languageMeta anchor not found')
          s=s.replace(anchor,block+anchor,1)
          oldmerge='''const t={...translations[lang], ...(extraTranslations[lang]||{}), ...(siteV8Translations[lang]||{})};'''
          newmerge='''const t={...translations[lang], ...(extraTranslations[lang]||{}), ...(siteV8Translations[lang]||{}), ...(bookingV13Translations[lang]||{})};'''
          if oldmerge not in s: raise SystemExit('translation merge anchor not found')
          s=s.replace(oldmerge,newmerge,1)

          oldfunc='''function setDateLimits(){\n  const ci=document.getElementById('checkin');\n  const co=document.getElementById('checkout');\n  if(!ci||!co) return;\n  const today=new Date();\n  const iso=d=>d.toISOString().split('T')[0];\n  ci.min=iso(today);\n  co.min=iso(today);\n  ci.addEventListener('change',()=>{\n    if(!ci.value) return;\n    const d=new Date(`${ci.value}T12:00:00`);\n    d.setDate(d.getDate()+1);\n    co.min=iso(d);\n    if(co.value && co.value<=ci.value) co.value='';\n  });\n}'''
          newfunc='''function setDateLimits(){\n  const ci=document.getElementById('checkin');\n  const co=document.getElementById('checkout');\n  const nights=document.getElementById('nights');\n  const summary=document.getElementById('bookingSummary');\n  if(!ci||!co) return;\n  const today=new Date();\n  const iso=d=>d.toISOString().split('T')[0];\n  const updateSummary=()=>{\n    if(!ci.value||!co.value){\n      if(nights) nights.value='';\n      if(summary){summary.hidden=true;summary.textContent='';}\n      return;\n    }\n    const start=new Date(`${ci.value}T12:00:00`);\n    const end=new Date(`${co.value}T12:00:00`);\n    const count=Math.round((end-start)/86400000);\n    if(count<1){\n      if(nights) nights.value='';\n      if(summary){summary.hidden=true;summary.textContent='';}\n      return;\n    }\n    if(nights) nights.value=String(count);\n    if(summary){\n      const lang=localStorage.getItem('nidoLanguage')||'it';\n      const labels={it:[count===1?'notte':'notti','Nessun pagamento ora'],en:[count===1?'night':'nights','No payment now'],es:[count===1?'noche':'noches','Sin pago ahora'],de:[count===1?'Nacht':'Nächte','Jetzt keine Zahlung'],fr:[count===1?'nuit':'nuits','Aucun paiement maintenant'],ru:[count===1?'ночь':'ночей','Сейчас без оплаты'],zh:['晚','此时无需付款']};\n      const l=labels[lang]||labels.it;\n      summary.textContent=`${count} ${l[0]} · ${l[1]}`;\n      summary.hidden=false;\n    }\n  };\n  ci.min=iso(today);\n  co.min=iso(today);\n  ci.addEventListener('change',()=>{\n    if(!ci.value){updateSummary();return;}\n    const d=new Date(`${ci.value}T12:00:00`);\n    d.setDate(d.getDate()+1);\n    co.min=iso(d);\n    if(co.value && co.value<=ci.value) co.value='';\n    updateSummary();\n  });\n  co.addEventListener('change',updateSummary);\n  updateSummary();\n}'''
          if oldfunc not in s: raise SystemExit('setDateLimits anchor not found')
          s=s.replace(oldfunc,newfunc,1)
          p.write_text(s)

          # STYLE
          p=Path('style.css')
          s=p.read_text()
          css='''\n\n/* v13 — polished direct-booking flow */\n.booking-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:38px 0 8px}\n.booking-step{border-top:1px solid var(--line);padding:20px 18px 18px 0;min-height:126px}\n.booking-step>span{display:block;font-size:9px;letter-spacing:.18em;color:var(--brand);margin-bottom:12px}\n.booking-step strong{display:block;font:500 24px/1.05 var(--serif);margin-bottom:8px}\n.booking-step p{margin:0;max-width:270px;font-size:12px;line-height:1.55;color:#666}\n.form-message{grid-column:1/-1}\n.booking-summary{width:max-content;max-width:100%;margin:-5px 0 22px;padding:8px 11px;background:var(--cream);border:1px solid var(--line);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#595a54}\n.booking-card .button-dark{min-width:190px}\n@media(max-width:900px){.booking-flow{grid-template-columns:1fr;gap:0;margin-top:30px}.booking-step{min-height:0;padding:16px 0}.booking-step p{max-width:none}.form-message{grid-column:auto}}\n@media(max-width:560px){.booking-step strong{font-size:22px}.booking-summary{width:100%;text-align:center}.booking-card .button-dark{width:100%}}\n'''
          if '/* v13 — polished direct-booking flow */' not in s:
              s += css
          p.write_text(s)

          # THANK-YOU PAGE
          Path('grazie.html').write_text('''<!doctype html>\n<html lang="it">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <meta name="robots" content="noindex,nofollow">\n  <title>Richiesta inviata — Il Nido di Sofì</title>\n  <link rel="preconnect" href="https://fonts.googleapis.com">\n  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">\n  <style>\n    :root{--ink:#252821;--cream:#f5f1e9;--paper:#fbfaf7;--brand:#6e3218;--line:#d8d3c8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',Arial,sans-serif}\n    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:var(--sans);padding:28px;display:grid;place-items:center}.card{width:min(880px,100%);background:#fff;border:1px solid var(--line);padding:clamp(38px,7vw,72px);box-shadow:0 18px 50px rgba(37,40,33,.045)}.logo{width:min(360px,72vw);margin:0 auto 38px}h1{font:600 clamp(44px,7vw,72px)/.98 var(--serif);margin:0 0 20px;text-align:center}.lead{font-size:15px;line-height:1.75;max-width:620px;margin:0 auto 36px;text-align:center}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 38px}.step{border-top:1px solid var(--line);padding:18px 16px 0 0}.step span{display:block;color:var(--brand);font-size:9px;letter-spacing:.17em;margin-bottom:9px}.step strong{display:block;font:500 22px/1.05 var(--serif);margin-bottom:7px}.step p{font-size:12px;line-height:1.55;color:#666;margin:0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:1px solid var(--ink);padding:12px 18px;text-decoration:none;color:var(--ink);text-transform:uppercase;letter-spacing:.1em;font-size:10px}.btn:hover,.btn.primary{background:var(--ink);color:white}.contact-note{text-align:center;color:#777;font-size:11px;margin:24px 0 0}@media(max-width:700px){body{padding:14px}.card{padding:38px 7%}.steps{grid-template-columns:1fr;gap:0}.step{padding:14px 0}.actions{flex-direction:column}.btn{text-align:center}}\n  </style>\n</head>\n<body>\n  <main class="card">\n    <img src="assets/logo-large.png" alt="Il Nido di Sofì" class="logo">\n    <h1 id="thanksTitle">Richiesta inviata.</h1>\n    <p class="lead" id="thanksText">Grazie. Abbiamo ricevuto la tua richiesta. Ora controlleremo personalmente disponibilità e totale del soggiorno.</p>\n    <div class="steps">\n      <div class="step"><span>01</span><strong id="step1Title">Controlliamo le date</strong><p id="step1Text">Verifichiamo disponibilità e durata del soggiorno.</p></div>\n      <div class="step"><span>02</span><strong id="step2Title">Ti rispondiamo</strong><p id="step2Text">Riceverai il totale esatto via email o WhatsApp.</p></div>\n      <div class="step"><span>03</span><strong id="step3Title">Confermi con Stripe</strong><p id="step3Text">Se vuoi procedere, riceverai un link personale e sicuro per il pagamento.</p></div>\n    </div>\n    <div class="actions">\n      <a class="btn primary" href="./" id="backLink">Torna al sito</a>\n      <a class="btn" href="https://wa.me/393342091777" id="waLink">Scrivici su WhatsApp</a>\n    </div>\n    <p class="contact-note" id="contactNote">La richiesta non è ancora una prenotazione confermata e non è stato effettuato alcun pagamento.</p>\n  </main>\n  <script>\n    const m={\n      it:['Richiesta inviata.','Grazie. Abbiamo ricevuto la tua richiesta. Ora controlleremo personalmente disponibilità e totale del soggiorno.','Controlliamo le date','Verifichiamo disponibilità e durata del soggiorno.','Ti rispondiamo','Riceverai il totale esatto via email o WhatsApp.','Confermi con Stripe','Se vuoi procedere, riceverai un link personale e sicuro per il pagamento.','Torna al sito','Scrivici su WhatsApp','La richiesta non è ancora una prenotazione confermata e non è stato effettuato alcun pagamento.'],\n      en:['Request sent.','Thank you. We received your request. We will now personally check availability and the total stay price.','We check your dates','We verify availability and the length of your stay.','We reply to you','You will receive the exact total by email or WhatsApp.','Confirm with Stripe','If you wish to proceed, you will receive a personal secure payment link.','Back to the website','Message us on WhatsApp','Your request is not yet a confirmed booking and no payment has been made.'],\n      es:['Solicitud enviada.','Gracias. Hemos recibido tu solicitud. Ahora comprobaremos personalmente la disponibilidad y el total de la estancia.','Comprobamos las fechas','Verificamos disponibilidad y duración de la estancia.','Te respondemos','Recibirás el total exacto por email o WhatsApp.','Confirma con Stripe','Si deseas continuar, recibirás un enlace de pago personal y seguro.','Volver al sitio','Escríbenos por WhatsApp','La solicitud todavía no es una reserva confirmada y no se ha realizado ningún pago.'],\n      de:['Anfrage gesendet.','Vielen Dank. Wir haben Ihre Anfrage erhalten. Nun prüfen wir persönlich Verfügbarkeit und Gesamtpreis.','Wir prüfen die Daten','Wir kontrollieren Verfügbarkeit und Aufenthaltsdauer.','Wir antworten Ihnen','Sie erhalten den genauen Gesamtbetrag per E-Mail oder WhatsApp.','Mit Stripe bestätigen','Wenn Sie fortfahren möchten, erhalten Sie einen persönlichen sicheren Zahlungslink.','Zurück zur Website','Per WhatsApp schreiben','Ihre Anfrage ist noch keine bestätigte Buchung und es wurde noch keine Zahlung vorgenommen.'],\n      fr:['Demande envoyée.','Merci. Nous avons reçu votre demande. Nous allons maintenant vérifier personnellement les disponibilités et le montant total du séjour.','Nous vérifions les dates','Nous contrôlons les disponibilités et la durée du séjour.','Nous vous répondons','Vous recevrez le montant exact par e-mail ou WhatsApp.','Confirmez avec Stripe','Si vous souhaitez continuer, vous recevrez un lien de paiement personnel et sécurisé.','Retour au site','Écrivez-nous sur WhatsApp','Votre demande n’est pas encore une réservation confirmée et aucun paiement n’a été effectué.'],\n      ru:['Запрос отправлен.','Спасибо. Мы получили ваш запрос. Теперь мы лично проверим доступность и общую стоимость проживания.','Проверяем даты','Проверяем доступность и продолжительность проживания.','Отвечаем вам','Точную сумму вы получите по электронной почте или WhatsApp.','Подтверждение через Stripe','Если вы захотите продолжить, мы отправим персональную безопасную ссылку для оплаты.','Вернуться на сайт','Написать в WhatsApp','Запрос ещё не является подтверждённым бронированием, и оплата не производилась.'],\n      zh:['申请已提交。','谢谢。我们已收到你的申请。接下来我们会人工确认房态和住宿总价。','核对日期','我们会确认房态和入住晚数。','回复你','你会通过邮件或 WhatsApp 收到准确总价。','通过 Stripe 确认','如需继续，我们会发送专属且安全的支付链接。','返回网站','WhatsApp 联系我们','当前申请尚未构成确认预订，也尚未进行任何付款。']\n    };\n    const p=new URLSearchParams(location.search); const lang=m[p.get('lang')]?p.get('lang'):'it'; const v=m[lang];\n    document.documentElement.lang=lang==='zh'?'zh-CN':lang;\n    ['thanksTitle','thanksText','step1Title','step1Text','step2Title','step2Text','step3Title','step3Text','backLink','waLink','contactNote'].forEach((id,i)=>document.getElementById(id).textContent=v[i]);\n  </script>\n</body>\n</html>\n''')
          PY
      - name: Sanity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text(); j=Path('script.js').read_text(); c=Path('style.css').read_text(); g=Path('grazie.html').read_text()
          checks=[
            ('phone field','name="Telefono / WhatsApp"' in i),
            ('nights field','id="nights"' in i),
            ('booking flow','booking-flow' in i and 'booking-step' in c),
            ('cache v13','style.css?v=13' in i and 'script.js?v=13' in i),
            ('translation bundle','bookingV13Translations' in j and 'form.phone' in j),
            ('nights calculation','bookingSummary' in j and 'count=Math.round' in j),
            ('ajax form preserved','formsubmit.co/ajax/ilnidodisofi@gmail.com' in j),
            ('thank you noindex','noindex,nofollow' in g),
            ('thank you stripe explanation','Stripe' in g and 'wa.me/393342091777' in g),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('FAILED: '+', '.join(bad))
          print('All sanity checks passed')
          PY
      - name: Commit changes
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add index.html script.js style.css grazie.html
          git commit -m "Polish direct booking request flow"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/polish-booking-flow.yml
          git commit -m "Remove temporary booking polish workflow"
          git push
