name: Compact Bravio v2

on:
  push:
    paths:
      - '.github/workflows/compact-bravio-v2.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Bravio compaction
        shell: bash
        run: |
          cat <<'EOF' >> style.css

/* v20 - compact Bravio homepage */
#bravio .bravio-copy > p:not(.lead){display:none}
#bravio .bravio-grid{gap:5vw}
#bravio .bravio-visual{min-height:330px}
#bravio .barrel-graphic{width:min(245px,58vw)}
#bravio .bravio-stats{bottom:8px}
#bravio .bravio-stats div{padding:10px 12px}
#bravio .bravio-stats strong{font-size:24px}
#bravio .bravio-actions{margin-top:24px}
@media(max-width:900px){
  #bravio .bravio-grid{grid-template-columns:1fr auto;gap:24px}
  #bravio .bravio-visual{min-height:250px;width:230px}
  #bravio .barrel-graphic{width:180px}
  #bravio .bravio-stats{display:none}
}
@media(max-width:560px){
  #bravio{padding-top:52px;padding-bottom:52px}
  #bravio .bravio-grid{grid-template-columns:1fr;gap:16px}
  #bravio .bravio-visual{display:none}
  #bravio .bravio-copy .lead{margin-bottom:0}
  #bravio .bravio-actions{margin-top:20px;gap:10px}
  #bravio .bravio-actions .button{width:100%;text-align:center}
}
EOF
          sed -i 's/style.css?v=19/style.css?v=20/' index.html
          grep -q 'compact Bravio homepage' style.css
          grep -q 'style.css?v=20' index.html
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'Il Nido di Sofi'
          git config user.email 'ilnidodisofi@gmail.com'
          git add style.css index.html
          git commit -m 'Compact Bravio section on homepage'
          git push
