name: Fix Val d'Orcia link contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-valdorcia-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add targeted link color override
        run: |
          cat >> style.css <<'EOF'

/* v10 — readable SEO link on cream Val d'Orcia section */
.valdorcia .bravio-link{
  color:var(--brand);
  border-bottom-color:rgba(110,50,24,.38);
  font-weight:500;
}
.valdorcia .bravio-link:hover{
  color:var(--ink);
  border-bottom-color:var(--ink);
}
EOF
      - name: Commit change
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add style.css
          git commit -m "Improve Val d'Orcia SEO link contrast" || exit 0
          git push
