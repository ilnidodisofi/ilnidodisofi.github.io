name: Refine booking email
on:
  push:
    paths:
      - .github/workflows/refine-mailto-email.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append refined mail composer
        run: |
          cat >> script.js <<'EOF'

          // v15 — refined plain-text email layout for direct booking requests.
          document.addEventListener('DOMContentLoaded',()=>{
            const form=document.getElementById('bookingForm');
            const status=document.getElementById('bookingStatus');
            if(!form||!status) return;
            const localeMap={it:'it-IT',en:'en-GB',es:'es-ES',de:'de-DE',fr:'fr-FR',ru:'ru-RU',zh:'zh-CN'};
            const copy={
              it:{subject:'Richiesta di soggiorno — Il Nido di Sofì',open:'Si sta aprendo la tua app email. Controlla la richiesta e premi Invia.',place:'Montepulciano · Toscana',request:'RICHIESTA DI SOGGIORNO',guest:'OSPITE',stay:'SOGGIORNO',name:'Nome e cognome',email:'Email',phone:'Telefono',checkin:'Check-in',checkout:'Check-out',duration:'Durata',guests:'Ospiti',message:'MESSAGGIO',one:'notte',many:'notti',note1:'La presente è una richiesta di disponibilità pre-compilata.',note2:'La prenotazione sarà confermata solo dopo la nostra verifica e il successivo pagamento tramite link Stripe personale.'},
              en:{subject:'Stay request — Il Nido di Sofì',open:'Your email app is opening. Review the request and press Send.',place:'Montepulciano · Tuscany',request:'STAY REQUEST',guest:'GUEST',stay:'STAY',name:'Full name',email:'Email',phone:'Phone',checkin:'Check-in',checkout:'Check-out',duration:'Length',guests:'Guests',message:'MESSAGE',one:'night',many:'nights',note1:'This is a pre-filled availability request.',note2:'The booking will be confirmed only after our check and the subsequent payment through your personal Stripe link.'},
              es:{subject:'Solicitud de estancia — Il Nido di Sofì',open:'Se está abriendo tu aplicación de correo. Revisa la solicitud y pulsa Enviar.',place:'Montepulciano · Toscana',request:'SOLICITUD DE ESTANCIA',guest:'HUÉSPED',stay:'ESTANCIA',name:'Nombre y apellidos',email:'Email',phone:'Teléfono',checkin:'Llegada',checkout:'Salida',duration:'Duración',guests:'Huéspedes',message:'MENSAJE',one:'noche',many:'noches',note1:'Esta es una solicitud de disponibilidad precompletada.',note2:'La reserva se confirmará únicamente después de nuestra comprobación y del posterior pago mediante tu enlace personal de Stripe.'},
              de:{subject:'Aufenthaltsanfrage — Il Nido di Sofì',open:'Ihre E-Mail-App wird geöffnet. Bitte prüfen Sie die Anfrage und klicken Sie auf Senden.',place:'Montepulciano · Toskana',request:'AUFENTHALTSANFRAGE',guest:'GAST',stay:'AUFENTHALT',name:'Vor- und Nachname',email:'E-Mail',phone:'Telefon',checkin:'Check-in',checkout:'Check-out',duration:'Dauer',guests:'Gäste',message:'NACHRICHT',one:'Nacht',many:'Nächte',note1:'Dies ist eine vorausgefüllte Verfügbarkeitsanfrage.',note2:'Die Buchung wird erst nach unserer Prüfung und der anschließenden Zahlung über Ihren persönlichen Stripe-Link bestätigt.'},
              fr:{subject:'Demande de séjour — Il Nido di Sofì',open:'Votre application e-mail va s’ouvrir. Vérifiez la demande puis appuyez sur Envoyer.',place:'Montepulciano · Toscane',request:'DEMANDE DE SÉJOUR',guest:'VOYAGEUR',stay:'SÉJOUR',name:'Nom et prénom',email:'E-mail',phone:'Téléphone',checkin:'Arrivée',checkout:'Départ',duration:'Durée',guests:'Voyageurs',message:'MESSAGE',one:'nuit',many:'nuits',note1:'Il s’agit d’une demande de disponibilité préremplie.',note2:'La réservation ne sera confirmée qu’après notre vérification et le paiement ultérieur via votre lien Stripe personnel.'},
              ru:{subject:'Запрос на проживание — Il Nido di Sofì',open:'Откроется ваше почтовое приложение. Проверьте запрос и нажмите «Отправить».',place:'Монтепульчано · Тоскана',request:'ЗАПРОС НА ПРОЖИВАНИЕ',guest:'ГОСТЬ',stay:'ПРОЖИВАНИЕ',name:'Имя и фамилия',email:'Email',phone:'Телефон',checkin:'Заезд',checkout:'Выезд',duration:'Продолжительность',guests:'Гости',message:'СООБЩЕНИЕ',one:'ночь',many:'ночей',note1:'Это предварительно заполненный запрос о доступности.',note2:'Бронирование будет подтверждено только после нашей проверки и последующей оплаты по вашей персональной ссылке Stripe.'},
              zh:{subject:'住宿申请 — Il Nido di Sofì',open:'即将打开你的邮件应用。请检查申请内容，然后点击发送。',place:'蒙特普尔恰诺 · 托斯卡纳',request:'住宿申请',guest:'住客',stay:'入住信息',name:'姓名',email:'电子邮箱',phone:'电话',checkin:'入住',checkout:'退房',duration:'住宿时长',guests:'人数',message:'留言',one:'晚',many:'晚',note1:'这是一封已预填的房态咨询邮件。',note2:'预订仅在我们确认房态并通过专属 Stripe 链接完成后续付款后才正式确认。'}
            };
            const val=name=>form.elements[name]?.value?.trim?.()||form.elements[name]?.value||'';
            const fmt=(value,lang)=>value?new Intl.DateTimeFormat(localeMap[lang]||'it-IT',{day:'numeric',month:'long',year:'numeric'}).format(new Date(`${value}T12:00:00`)):'';
            form.addEventListener('submit',(e)=>{
              e.preventDefault();
              e.stopImmediatePropagation();
              if(!form.reportValidity()) return;
              const lang=localStorage.getItem('nidoLanguage')||'it';
              const t=copy[lang]||copy.it;
              const nights=Number(val('Notti'))||0;
              const duration=nights?`${nights} ${nights===1?t.one:t.many}`:'—';
              const line='────────────────────────';
              const body=[
                'IL NIDO DI SOFÌ',t.place,'',line,t.request,line,'',
                t.guest,
                `${t.name}: ${val('Nome e cognome')}`,
                `${t.email}: ${val('email')}`,
                `${t.phone}: ${val('Telefono / WhatsApp')}`,'',
                t.stay,
                `${t.checkin}: ${fmt(val('Check-in'),lang)}`,
                `${t.checkout}: ${fmt(val('Check-out'),lang)}`,
                `${t.duration}: ${duration}`,
                `${t.guests}: ${val('Ospiti')}`,'',
                t.message,
                val('Messaggio')||'—','',line,
                t.note1,t.note2,'',
                'IL NIDO DI SOFÌ','Via del Poliziano 12 · Montepulciano'
              ].join('\n');
              status.hidden=false;
              status.className='booking-status is-success';
              status.textContent=t.open;
              window.location.href=`mailto:ilnidodisofi@gmail.com?subject=${encodeURIComponent(t.subject)}&body=${encodeURIComponent(body)}`;
            },true);
          });
          EOF
          sed -i 's/style.css?v=14/style.css?v=15/g; s/script.js?v=14/script.js?v=15/g' index.html
      - name: Sanity checks
        run: |
          node --check script.js
          grep -q 'richiesta di disponibilità pre-compilata' script.js
          grep -q 'script.js?v=15' index.html
      - name: Commit changes
        run: |
          git config user.name 'Il Nido di Sofì'
          git config user.email 'ilnidodisofi@gmail.com'
          git add script.js index.html
          git commit -m 'Refine booking request email layout'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/refine-mailto-email.yml
          git commit -m 'Remove temporary email refinement workflow'
          git push
