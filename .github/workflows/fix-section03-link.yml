name: Fix section 03 link contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-section03-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add section 03 link color override
        run: |
          cat >> style.css <<'EOF'

/* v11 — readable SEO link in section 03 */
.places .bravio-link{
  color:var(--brand);
  border-bottom-color:rgba(110,50,24,.38);
  font-weight:500;
}
.places .bravio-link:hover{
  color:var(--ink);
  border-bottom-color:var(--ink);
}
EOF
      - name: Commit change
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add style.css
          git commit -m "Improve section 03 SEO link contrast" || exit 0
          git push
