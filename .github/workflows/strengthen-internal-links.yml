name: Strengthen internal SEO links
on:
  push:
    paths:
      - '.github/workflows/strengthen-internal-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen homepage internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="footer-links"><a href="#prenota" data-i18n="footer.book">Prenota</a><a href="/montepulciano/">Montepulciano</a><a href="/bravio-delle-botti/">Bravìo delle Botti</a><a href="/val-dorcia/">Val d\'Orcia</a></div>'
          new='<div class="footer-links"><a href="#prenota" data-i18n="footer.book">Prenota</a><a href="/montepulciano/">Montepulciano</a><a href="/dove-dormire-montepulciano/">Dove dormire</a><a href="/weekend-romantico-montepulciano/">Weekend romantico</a><a href="/montepulciano-senza-auto/">Senza auto</a><a href="/parcheggi-montepulciano/">Parcheggi</a><a href="/bravio-delle-botti/">Bravìo delle Botti</a><a href="/val-dorcia/">Val d\'Orcia</a></div>'
          if old not in s:
              raise SystemExit('footer links block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Sanity checks
        run: |
          grep -q '/dove-dormire-montepulciano/' index.html
          grep -q '/weekend-romantico-montepulciano/' index.html
          grep -q '/montepulciano-senza-auto/' index.html
          grep -q '/parcheggi-montepulciano/' index.html
      - name: Commit changes
        run: |
          git config user.name "Il Nido di Sofì"
          git config user.email "ilnidodisofi@gmail.com"
          git add index.html
          git commit -m "Strengthen homepage internal links for Montepulciano SEO" || true
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/strengthen-internal-links.yml
          git commit -m "Remove temporary internal links workflow"
          git push
